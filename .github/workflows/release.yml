name: Release

# Builds the Windows .exe, macOS .app and Linux .deb and attaches them to a
# GitHub Release. Trigger: push a tag like v1.1.0 (or run manually).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows .exe
        if: matrix.name == 'windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SeasonFall --icon packaging/seasonfall.ico
          --paths . packaging/entrypoint.py

      - name: Build macOS .app
        if: matrix.name == 'macos'
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SeasonFall --icon packaging/seasonfall.ico
          --osx-bundle-identifier com.seasonfall.app
          --paths . packaging/entrypoint.py

      - name: Build Linux binary
        if: matrix.name == 'linux'
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name SeasonFall --paths . packaging/entrypoint.py

      - name: Package Linux .deb
        if: matrix.name == 'linux'
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh dist/SeasonFall releases

      - name: Zip macOS .app
        if: matrix.name == 'macos'
        run: |
          cd dist
          ditto -c -k --keepParent SeasonFall.app SeasonFall-macOS.zip
          mv SeasonFall-macOS.zip ../

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          if [ -f dist/SeasonFall.exe ]; then
            cp dist/SeasonFall.exe release/SeasonFall-Windows.exe
          fi
          if [ -f SeasonFall-macOS.zip ]; then
            cp SeasonFall-macOS.zip release/
          fi
          if ls ./*.deb 1>/dev/null 2>&1; then
            cp ./*.deb release/
          elif ls releases/*.deb 1>/dev/null 2>&1; then
            cp releases/*.deb release/
          fi
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: SeasonFall-${{ matrix.name }}
          path: release/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
