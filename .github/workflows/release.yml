name: Release

# Builds Windows .exe, macOS .app, Linux .deb, Android .apk and attaches
# them to a GitHub Release. Trigger: push a tag like v1.3.0 (or run manually).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
          - name: macos
            os: macos-latest
          - name: linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
          python -c "import PySide6; print('PySide6', PySide6.__version__)"

      # Pin stays on PySide6 6.9.x (see requirements.txt). Do NOT bundle
      # unicode-org ICU: those DLLs export versioned symbols and break Qt
      # with "DLL load failed … procedure could not be found" on Windows.
      - name: Build Windows .exe
        if: matrix.name == 'windows'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name SeasonFall --icon packaging/seasonfall.ico
          --paths . packaging/entrypoint.py

      - name: Build macOS .app
        if: matrix.name == 'macos'
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name SeasonFall --icon packaging/seasonfall.icns
          --osx-bundle-identifier com.seasonfall.app
          --paths . packaging/entrypoint.py

      - name: Build Linux binary
        if: matrix.name == 'linux'
        run: >
          pyinstaller --noconfirm --clean --onefile
          --name SeasonFall --paths . packaging/entrypoint.py

      - name: Package Linux .deb
        if: matrix.name == 'linux'
        run: |
          chmod +x packaging/build_deb.sh
          ./packaging/build_deb.sh dist/SeasonFall releases

      - name: Zip macOS .app
        if: matrix.name == 'macos'
        run: |
          cd dist
          ditto -c -k --keepParent SeasonFall.app SeasonFall-macOS.zip
          mv SeasonFall-macOS.zip ../

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p release
          if [ -f dist/SeasonFall.exe ]; then
            cp dist/SeasonFall.exe release/SeasonFall-Windows.exe
          fi
          if [ -f SeasonFall-macOS.zip ]; then
            cp SeasonFall-macOS.zip release/
          fi
          if ls SeasonFall_*.deb 1>/dev/null 2>&1; then
            cp SeasonFall_*.deb release/
          elif ls releases/SeasonFall_*_amd64.deb 1>/dev/null 2>&1; then
            newest=$(ls -t releases/SeasonFall_*_amd64.deb | head -1)
            cp "$newest" release/
          fi
          ls -la release/

      - uses: actions/upload-artifact@v4
        with:
          name: SeasonFall-${{ matrix.name }}
          path: release/*

  android:
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build release APK
        working-directory: android
        run: |
          set -euo pipefail
          curl -fsSL -o /tmp/gradle.zip \
            https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.9/bin/gradle wrapper --gradle-version 8.9
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p ../release-android
          cp app/build/outputs/apk/release/app-release.apk \
            ../release-android/SeasonFall-Android.apk
          ls -la ../release-android/

      - uses: actions/upload-artifact@v4
        with:
          name: SeasonFall-android
          path: release-android/*

  release:
    needs: [build, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
